[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_name }}"
requires-python = ">={{ cookiecutter.python_version }}"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
{%- if cookiecutter.use_auth == "y" %}
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
{%- endif %}
{%- if cookiecutter.use_auth == "y" and (cookiecutter.use_auth_jwt_bearer == "y" or cookiecutter.use_auth_jwt_cookie == "y" or cookiecutter.use_social_login == "y") %}
    "pyjwt>=2.9",
{%- endif %}
{%- if cookiecutter.use_auth == "y" and cookiecutter.use_social_login == "y" %}
    # Social login: the OAuth2 calls to Google/GitHub.
    "httpx>=0.27",
{%- endif %}
{%- if cookiecutter.use_redis == "y" %}
    "redis>=5.0.1",
{%- endif %}
{%- if cookiecutter.use_celery == "y" %}
    "celery>=5.4",
{%- endif %}
{%- if cookiecutter.use_flower == "y" %}
    "flower>=2.0",
{%- endif %}
{%- if cookiecutter.use_grpc == "y" %}
    # The committed stubs in app/grpc/generated were generated with grpcio-tools 1.85.1
    # (protobuf 7.35.1) and refuse to import with anything older.
    "grpcio>=1.85.1",
    "grpcio-reflection>=1.85.1",
    "protobuf>=7.35.1",
{%- endif %}
{%- if cookiecutter.use_graphql == "y" %}
    # 0.339 added the WebSocket Origin check (allowed_origins) that subscriptions rely on.
    "strawberry-graphql>=0.339",
{%- endif %}
{%- if cookiecutter.database == "postgresql" %}
    "asyncpg>=0.29",
{%- elif cookiecutter.database == "mysql" %}
    "aiomysql>=0.2",
{%- else %}
    "aiosqlite>=0.20",
{%- endif %}
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "aiosqlite>=0.20",
{%- if cookiecutter.use_redis == "y" %}
    "fakeredis>=2.23",
{%- endif %}
{%- if cookiecutter.use_grpc == "y" %}
    # Pinned exactly: a test regenerates the stubs and compares them with the committed ones.
    "grpcio-tools==1.85.1",
{%- endif %}
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py{{ cookiecutter.python_version|replace('.', '') }}"

{%- if cookiecutter.use_grpc == "y" %}
extend-exclude = ["app/grpc/generated"]
{%- endif %}

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "{{ cookiecutter.python_version }}"
strict = true
files = ["app"]
{%- if cookiecutter.use_celery == "y" %}

# celery and kombu ship no type stubs.
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

# @celery_app.task is untyped, so every task function would otherwise be flagged.
[[tool.mypy.overrides]]
module = ["app.worker.tasks.*"]
disallow_untyped_decorators = false
{%- endif %}

{%- if cookiecutter.use_grpc == "y" %}

# grpcio ships no type information, and the generated stubs are not ours to annotate.
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "grpc_reflection", "grpc_reflection.*", "grpc_tools", "grpc_tools.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.grpc.generated.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.grpc.*"]
disallow_subclassing_any = false
disallow_untyped_calls = false
{%- endif %}

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
