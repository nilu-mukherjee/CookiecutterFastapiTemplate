[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_name }}"
requires-python = ">={{ cookiecutter.python_version }}"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
{%- if cookiecutter.use_auth == "y" %}
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
{%- endif %}
{%- if cookiecutter.use_auth == "y" and (cookiecutter.use_auth_jwt_bearer == "y" or cookiecutter.use_auth_jwt_cookie == "y" or cookiecutter.use_social_login == "y") %}
    "pyjwt>=2.9",
{%- endif %}
{%- if cookiecutter.use_auth == "y" and cookiecutter.use_social_login == "y" %}
    # Social login: OAuth2 client (Authlib) over httpx.
    "authlib>=1.6",
    "httpx>=0.27",
{%- endif %}
{%- if cookiecutter.use_redis == "y" %}
    "redis>=5",
{%- endif %}
{%- if cookiecutter.database == "postgresql" %}
    "asyncpg>=0.29",
{%- elif cookiecutter.database == "mysql" %}
    "aiomysql>=0.2",
{%- else %}
    "aiosqlite>=0.20",
{%- endif %}
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "aiosqlite>=0.20",
{%- if cookiecutter.use_redis == "y" %}
    "fakeredis>=2.23",
{%- endif %}
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py{{ cookiecutter.python_version|replace('.', '') }}"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "{{ cookiecutter.python_version }}"
strict = true
files = ["app"]
{%- if cookiecutter.use_auth == "y" and cookiecutter.use_social_login == "y" %}

# Authlib ships no type information.
[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true
{%- endif %}

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
